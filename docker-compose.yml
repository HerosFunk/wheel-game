version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: wheel-game-mongodb
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - wheel-network

  backend:
    build:
      context: ./wheel-api
      dockerfile: Dockerfile
    container_name: wheel-game-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=${NODE_ENV}
    depends_on:
      - mongodb
    networks:
      - wheel-network

  frontend:
    build:
      context: ./wheel-front
      dockerfile: Dockerfile
    container_name: wheel-game-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    depends_on:
      - backend
    networks:
      - wheel-network

networks:
  wheel-network:
    driver: bridge

volumes:
  mongodb_data: 