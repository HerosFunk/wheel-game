version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: wheel-game-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    networks:
      - wheel-network

  backend:
    build:
      context: ./wheel-api
      dockerfile: Dockerfile
    container_name: wheel-game-backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/wheel-game?authSource=admin
      - JWT_SECRET=your_jwt_secret_key
      - NODE_ENV=development
    depends_on:
      - mongodb
    networks:
      - wheel-network

  frontend:
    build:
      context: ./wheel-front
      dockerfile: Dockerfile
    container_name: wheel-game-frontend
    ports:
      - "3001:3001"
    environment:
      - REACT_APP_API_URL=https://wheel-game.azurewebsites.net
      - REACT_APP_SOCKET_URL=https://wheel-game.azurewebsites.net
    depends_on:
      - backend
    networks:
      - wheel-network

networks:
  wheel-network:
    driver: bridge

volumes:
  mongodb_data: 