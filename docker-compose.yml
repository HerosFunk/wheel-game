version: '3.8'

services:
  backend:
    build:
      context: ./wheel-api
      dockerfile: Dockerfile
    container_name: wheel-game-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=${NODE_ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wheel-network

  frontend:
    build:
      context: ./wheel-front
      dockerfile: Dockerfile
    container_name: wheel-game-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    depends_on:
      - backend
    networks:
      - wheel-network

networks:
  wheel-network:
    driver: bridge 