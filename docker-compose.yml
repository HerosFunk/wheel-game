version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: wheel-game-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - wheel-network

  backend:
    build:
      context: ./wheel-api
      dockerfile: Dockerfile
    container_name: wheel-game-backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongo:27017/wheel-game?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=${NODE_ENV:-production}
      - PASSWORD_CREATOR=${PASSWORD_CREATOR:-creator}
      - PASSWORD_CLIENT=${PASSWORD_CLIENT:-client}
      - FRONTEND_URL=${FRONTEND_URL:-*}
    depends_on:
      - mongo
    networks:
      - wheel-network

  frontend:
    build:
      context: ./wheel-front
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""
    container_name: wheel-game-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - wheel-network

volumes:
  mongo-data:

networks:
  wheel-network:
    driver: bridge
